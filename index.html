<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HUNTER ARISE — Prototype</title>
<style>
  *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#f5f7ff;font-family:system-ui,Arial}
  #game{position:fixed;inset:0} canvas{display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  .top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .panel{background:#101827cc;border:1px solid #ffffff25;border-radius:14px;padding:10px 14px;backdrop-filter:blur(8px);box-shadow:0 8px 28px #0004}
  .brand{font-weight:900;letter-spacing:2px;font-size:15px}.sub{font-size:11px;color:#a9b8d0;margin-top:2px}
  #score{font-weight:800;font-size:18px;text-align:right} #hint{position:absolute;top:86px;left:50%;transform:translateX(-50%);font-size:12px;color:#d7e3f7;white-space:nowrap;text-align:center}
  #message{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);font-weight:900;font-size:clamp(22px,5vw,42px);text-align:center;text-shadow:0 4px 20px #000;opacity:0;transition:opacity .2s}
  #controls{position:absolute;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end}
  #stick{width:116px;height:116px;border-radius:50%;border:2px solid #ffffff66;background:#16243c99;pointer-events:auto;touch-action:none;position:relative}
  #nub{position:absolute;width:48px;height:48px;border-radius:50%;background:#8bd9ffcc;border:2px solid #fff;left:32px;top:32px}
  #jump{pointer-events:auto;touch-action:none;width:76px;height:76px;border-radius:50%;border:2px solid #fff;background:#ffbd59dd;color:#172033;font-weight:900;font-size:13px}
  #restart{pointer-events:auto;border:1px solid #ffffff55;background:#243653;color:white;border-radius:10px;padding:8px 12px;font-weight:700}
  .bottomnote{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:10px;color:#b8c6dc;background:#10182799;padding:5px 9px;border-radius:8px;white-space:nowrap}
  @media (hover:hover) and (pointer:fine){#controls{display:none}.bottomnote{bottom:14px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="top">
    <div class="panel"><div class="brand">HUNTER ARISE</div><div class="sub">LOW-POLY ARENA · PROTOTYPE 0.1</div></div>
    <div class="panel"><div class="sub">CRYSTALS</div><div id="score">0 / 12</div></div>
  </div>
  <div id="hint">Explore the arena and collect all 12 energy crystals</div>
  <div id="message">ARENA CLEARED!</div>
  <div id="controls">
    <div id="stick"><div id="nub"></div></div>
    <button id="jump">JUMP</button>
  </div>
  <div class="bottomnote">PC: WASD / Arrow keys + Space · Mobile: joystick + JUMP</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
if (!window.THREE) { document.querySelector("#hint").textContent = "3D engine could not load. Open this game from an online preview with internet access."; throw new Error("Three.js failed to load"); }

const mount=document.querySelector('#game');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c9df);
scene.fog=new THREE.Fog(0x91c9df,28,75);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,120);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
mount.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe7f7ff,0x59634d,2.0));
const sun=new THREE.DirectionalLight(0xfff0d0,2.3); sun.position.set(-12,22,10); sun.castShadow=true; sun.shadow.mapSize.set(1024,1024); scene.add(sun);

const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness,flatShading:true});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90),mat(0x668c68)); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const grid=new THREE.GridHelper(80,40,0x466c58,0x789879); grid.position.y=.015; scene.add(grid);

// Arena boundary and low-poly scenery
for(let i=0;i<24;i++){
  const a=i/24*Math.PI*2, r=27;
  const h=2.4+(i%3)*.45;
  const pillar=new THREE.Mesh(new THREE.CylinderGeometry(.65,.9,h,5),mat(i%2?0x536b83:0x7a8294));
  pillar.position.set(Math.cos(a)*r,h/2,Math.sin(a)*r); pillar.castShadow=true; pillar.receiveShadow=true; scene.add(pillar);
}
for(let i=0;i<15;i++){
  const a=i*2.4, r=10+(i%4)*3, x=Math.cos(a)*r,z=Math.sin(a)*r;
  const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.8+(i%3)*.35,0),mat(i%2?0x82917b:0x9b9b83));
  rock.position.set(x,.55,z); rock.scale.y=.8; rock.castShadow=true; scene.add(rock);
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16,.24,1.3,5),mat(0x76533b)); trunk.position.set(x+2,.65,z-1.4); trunk.castShadow=true; scene.add(trunk);
  const crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,0),mat(0x39785b)); crown.position.set(x+2,1.65,z-1.4); crown.castShadow=true; scene.add(crown);
}

// Player: friendly explorer avatar, no weapons
const player=new THREE.Group(); scene.add(player);
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.72,4,7),mat(0x2878c8)); body.position.y=1.05; body.castShadow=true; player.add(body);
const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.34,1),mat(0xf0c59b)); head.position.y=1.78; head.castShadow=true; player.add(head);
const visor=new THREE.Mesh(new THREE.BoxGeometry(.42,.12,.12),mat(0x182b43,.35)); visor.position.set(0,1.82,.29); player.add(visor);
const pack=new THREE.Mesh(new THREE.BoxGeometry(.48,.55,.22),mat(0xf0a33a)); pack.position.set(0,1.15,-.38); player.add(pack);
player.position.set(0,0,0);

// Crystal collectibles
const crystals=[];
const spots=[[-7,-5],[5,-8],[10,4],[-12,7],[2,13],[-4,17],[16,-12],[-17,-9],[19,10],[-19,0],[7,20],[-9,-19]];
spots.forEach((p,i)=>{
 const g=new THREE.Group();
 const gem=new THREE.Mesh(new THREE.OctahedronGeometry(.55,0),new THREE.MeshStandardMaterial({color:i%2?0x53f0d1:0xffd45c,emissive:i%2?0x0b6655:0x805000,emissiveIntensity:.7,flatShading:true}));
 gem.castShadow=true; g.add(gem);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.72,.045,5,18),mat(0xe9fbff)); ring.rotation.x=Math.PI/2; g.add(ring);
 g.position.set(p[0],1.25,p[1]); scene.add(g); crystals.push({group:g,active:true});
});

const keys={}; addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(e.key.toLowerCase()))e.preventDefault();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy={x:0,y:0},jumpQueued=false,score=0,vy=0,onGround=true;
const stick=document.querySelector('#stick'),nub=document.querySelector('#nub');
let stickId=null;
function setStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy),max=37;if(len>max){dx=dx/len*max;dy=dy/len*max;}joy.x=dx/max;joy.y=dy/max;nub.style.transform=`translate(${dx}px,${dy}px)`;}
stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);setStick(e);});
stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)setStick(e);});
function releaseStick(e){if(e.pointerId===stickId){stickId=null;joy={x:0,y:0};nub.style.transform='translate(0,0)';}}
stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);
document.querySelector('#jump').addEventListener('pointerdown',e=>{e.preventDefault();jumpQueued=true;});
document.querySelector('#restart').addEventListener('click',()=>location.reload());

const clock=new THREE.Clock();
function animate(){
 requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
 crystals.forEach(c=>{if(c.active){c.group.rotation.y+=dt*1.2;c.group.position.y=1.25+Math.sin(t*2+c.group.position.x)*.13;}});
 let ix=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;
 let iz=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;
 const len=Math.hypot(ix,iz); if(len>1){ix/=len;iz/=len;}
 const speed=8;
 if(len>.08){player.position.x+=ix*speed*dt;player.position.z+=iz*speed*dt;player.rotation.y=Math.atan2(ix,iz);}
 player.position.x=THREE.MathUtils.clamp(player.position.x,-24,24);player.position.z=THREE.MathUtils.clamp(player.position.z,-24,24);
 if(jumpQueued&&onGround){vy=8;onGround=false;} jumpQueued=false;
 vy-=20*dt;player.position.y+=vy*dt;if(player.position.y<=0){player.position.y=0;vy=0;onGround=true;}
 for(const c of crystals){if(c.active&&player.position.distanceTo(c.group.position)<1.35){c.active=false;scene.remove(c.group);score++;document.querySelector('#score').textContent=`${score} / 12`;}}
 if(score===12)document.querySelector('#message').style.opacity=1;
 const desired=new THREE.Vector3(player.position.x,player.position.y+5.2,player.position.z+9.5);
 camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(player.position.x,player.position.y+1,player.position.z);
 renderer.render(scene,camera);
}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
